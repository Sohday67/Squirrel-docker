# Tailscale overlay — use with:
#   docker compose -f docker-compose.yml -f docker-compose.tailscale.yml up -d
#
# Required environment variables (set in .env or export before running):
#   TS_AUTHKEY  – Tailscale auth key (https://login.tailscale.com/admin/settings/keys)
#   TS_HOSTNAME – Machine name on your tailnet (e.g. "squirrel")
#
# After the stack is running the web UI is reachable at:
#   https://<TS_HOSTNAME>.<tailnet-name>.ts.net

services:
  tailscale:
    image: tailscale/tailscale:latest
    hostname: ${TS_HOSTNAME:-squirrel}
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=true
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale:/config
    restart: unless-stopped
    depends_on:
      - web
      - server

  # Remove host port bindings — traffic goes through the Tailscale proxy.
  web:
    ports: !reset []

  server:
    ports: !reset []

volumes:
  tailscale-state:
