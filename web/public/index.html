<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#00897B">
    <meta name="description" content="Squirrel - Personal Expense Tracker">
    <title>Squirrel - Expense Tracker</title>
    <link rel="stylesheet" href="/css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>
    <div id="app">
        <div class="loading-screen">
            <div class="spinner"></div>
            <p>Loading Squirrel...</p>
        </div>
    </div>

    <div id="toast-container"></div>

    <div id="modal-overlay" class="modal-overlay hidden" onclick="App.closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div id="modal-body"></div>
        </div>
    </div>

    <script src="/js/currencies.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/categories.js"></script>
    <script src="/js/returns.js"></script>
    <script src="/js/spending.js"></script>
    <script src="/js/dashboard.js"></script>
    <script src="/js/stats.js"></script>
    <script src="/js/settings.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
